[project.theme]
language = "zh"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",   # 侧边栏按分组折叠
  "navigation.indexes",
  "navigation.path",
  "navigation.top",        # 回到顶部按钮
  "navigation.footer",
  "toc.follow",            # 右侧目录跟随滚动
  "content.action.edit",   # 启用页面编辑按钮
]

# 常用 Markdown 扩展（表格、提示块、代码块等）
markdown_extensions = [
  "tables",
  "admonition",
  "toc",
  "pymdownx.superfences",
]


[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "*",
]

[project.extra.consent]
title = "Cookie 使用提示"
description = """
  我们使用 Cookie 来识别您的重复访问和偏好设置
  同时用于评估文档的使用效果，了解您是否能顺利找到所需内容
  您的授权同意将帮助我们持续改进文档质量，为您提供更好的体验
"""

[project.extra.analytics]
provider = "google"
property = "G-X1ZDQMMRTK"

