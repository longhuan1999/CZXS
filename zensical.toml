# Zensical 配置（Material for MkDocs 原作者的下一代生成器）
# 文档：https://zensical.org/

[project]
site_name = "纯稚学 · 纯稚怎么翻译？"
site_description = "百家争鸣：用各自的专业拆解《后会友期》里白小纯与青稚的词不达意"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "localhost:8000"
repo_url = "https://github.com/longhuan1999/CZXS"
repo_name = "纯稚学说"
edit_uri = "edit/main/docs"
extra_javascript = ["javascripts/external-links.js"]

[project.theme]
language = "zh"
features = [
  "navigation.sections",   # 侧边栏按分组折叠
  "navigation.top",        # 回到顶部按钮
  "toc.follow",            # 右侧目录跟随滚动
  "content.action.edit",   # 启用页面编辑按钮
]

# 常用 Markdown 扩展（表格、提示块、代码块等）
markdown_extensions = [
  "tables",
  "admonition",
  "toc",
  "pymdownx.superfences",
]

